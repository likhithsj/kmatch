group=io.github.likhithsj
version=0.3.0-SNAPSHOT

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

kotlin.code.style=official
# Apple targets are declared unconditionally; on non-mac hosts they are skipped.
kotlin.native.ignoreDisabledTargets=true

# Central Portal publishing (vanniktech maven-publish plugin)
SONATYPE_HOST=CENTRAL_PORTAL
RELEASE_SIGNING_ENABLED=false

POM_NAME=kmatch
POM_DESCRIPTION=Fast, RapidFuzz-compatible fuzzy string matching for Kotlin Multiplatform. Bit-exact parity, full Unicode, zero dependencies.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/likhithsj/kmatch
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/likhithsj/kmatch
POM_SCM_CONNECTION=scm:git:git://github.com/likhithsj/kmatch.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/likhithsj/kmatch.git
POM_DEVELOPER_ID=likhithsj
POM_DEVELOPER_NAME=Likhith Serkad Jayakumar
POM_DEVELOPER_URL=https://github.com/likhithsj

# Dokka v2 Gradle plugin mode
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true
