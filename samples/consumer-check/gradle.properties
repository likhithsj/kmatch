org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
kotlin.code.style=official
# Apple/Windows targets are declared unconditionally; disabled on hosts that
# cannot build them.
kotlin.native.ignoreDisabledTargets=true
# JDKs installed by actions/setup-java for the runtime-version matrix.
org.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64
