# Move this file to .github/workflows/docs.yml to activate.
# (GitHub blocks workflow files from being pushed by this repo's automation
# credentials; move it via the GitHub web UI like ci.yml was.)
#
# Publishes the site to GitHub Pages on every push to main:
#   /     -> browser playground (demo module, Kotlin/JS)
#   /api  -> Dokka API docs
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :demo:jsBrowserDistribution dokkaGenerate --stacktrace
      - name: Assemble site
        run: |
          mkdir -p site/api
          cp -r demo/build/dist/js/productionExecutable/. site/
          rm -f site/demo.js.map
          cp -r build/dokka/html/. site/api/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
